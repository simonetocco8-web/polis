name: Pubblica Nomos
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v0.5.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          test "$(git cat-file -t v0.5.0)" = tag
          git merge-base --is-ancestor v0.5.0 origin/main
          composer audit --locked
          npm ci
          npm audit --audit-level=high
          npm run build
      - run: |
          scripts/package-cpanel.sh "$RUNNER_TEMP/nomos" v0.5.0
          scripts/package-nomos-update.sh "$RUNNER_TEMP/nomos"
      - name: Pubblica i pacchetti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.0 "$RUNNER_TEMP/nomos/"* --verify-tag --title Nomos \
            --notes 'Ordinamento dimostrativo, ricorsi, revoca, emergenze e registro verificabile. Include pacchetto cPanel completo, aggiornamento da Stabilitas v0.4.1 e checksum SHA-256.'

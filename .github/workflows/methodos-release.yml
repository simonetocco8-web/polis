name: Pubblica Methodos
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v0.2.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          test "$(git cat-file -t v0.2.0)" = tag
          git merge-base --is-ancestor v0.2.0 origin/main
          composer audit --locked
          npm ci
          npm audit --audit-level=high
          npm run build
      - run: |
          scripts/package-cpanel.sh "$RUNNER_TEMP/methodos" v0.2.0
          scripts/package-methodos-update.sh "$RUNNER_TEMP/methodos"
      - name: Pubblica i pacchetti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 "$RUNNER_TEMP/methodos/"* --verify-tag --title Methodos \
            --notes 'Protocollo Methodos 1.0, sei scenari, catalogo degli indicatori e Polis Index dimostrativo. Nessun risultato sperimentale. Disponibili pacchetto completo e aggiornamento da Foundation, con checksum. Questo rilascio non esegue il deployment.'

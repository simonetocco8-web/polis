name: Verifica portale
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run check && npm run build
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: composer test
      - run: php artisan documents:validate
      - run: php artisan research:validate
      - run: php artisan demos:validate
      - run: php artisan oikonomia:validate
      - run: php artisan stabilitas:validate
      - run: php artisan nomos:validate
      - run: php artisan archon:validate
      - run: git diff --exit-code v0.4.1 HEAD -- content/documents content/research content/statistics/demos.json content/statistics/oikonomia.json content/statistics/oikonomia.sha256 content/statistics/stabilitas.json content/statistics/stabilitas.sha256 simulation/demos simulation/oikonomia simulation/stabilitas simulation/archive simulation/stabilitas-sources simulation/config/model-1.json simulation/config/oikonomia-1.json simulation/config/stabilitas-1.json
      - run: git diff --exit-code v0.4.0 HEAD -- content/documents content/research content/statistics/oikonomia.json content/statistics/oikonomia.sha256 simulation/config/oikonomia-1.json simulation/oikonomia-report.md
      - name: Preserva le versioni documentali pubblicate
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-document-history.php "$BASE_REVISION"
      - run: composer audit --locked
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: simulation/requirements*.lock
      - run: python -m pip install -r requirements-test.lock
      - run: python -m demos.cli sources sources --offline
      - run: git diff --exit-code -- sources
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-archon.lock
      - run: python -m unittest discover -s provider-tests -v
      - run: ../scripts/check-archon-export.sh
      - run: git diff --exit-code v0.5.0 HEAD -- ../docs/architecture/government-proposal-1.0.schema.json ../content/statistics/nomos.json ../content/statistics/nomos.sha256

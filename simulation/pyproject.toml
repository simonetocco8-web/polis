[project]
name = "polis-demos"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
test = ["hypothesis==6.155.0", "sortedcontainers==2.4.0"]

[tool.setuptools]
packages = ["demos", "oikonomia", "stabilitas", "nomos", "archon", "theoria"]

[tool.setuptools.package-data]
archon = ["prompt-1.0.txt"]
theoria = ["rules.json"]
